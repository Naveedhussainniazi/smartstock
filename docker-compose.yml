
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: smartstock-backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost

    expose:
      - "5000"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api

    container_name: smartstock-frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy
